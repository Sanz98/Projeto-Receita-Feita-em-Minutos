<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Receita Feita em Minutos</title>
    <!-- Vinculando o seu arquivo de CSS existente -->
    <link rel="stylesheet" href="Style/styles.css">
</head>
<body>
    <!-- Reutilizando a classe de container do login para manter o mesmo estilo -->
    <div class="form-container login-container">
        <div class="form-header">
            <h2>Esqueci minha senha 🍳</h2>
            <p>Digite seu e-mail cadastrado. Enviaremos um link seguro para você criar uma nova senha.</p>
        </div>

        <form id="form-esqueci">
            <div class="input-group">
                <label for="email">E-mail de Cadastro</label>
                <input type="email" id="email" placeholder="Ex: chef@email.com" required>
            </div>
            
            <button type="submit" class="btn-submit">Enviar Link de Recuperação</button>
        </form>

        <div class="form-footer">
            <p>Lembrou a senha? <a href="login.html">Voltar para o Login</a></p>
        </div>
    </div>

    <!-- Importando o script que criamos na etapa anterior -->
    <script src="esqueci-senha.js"></script>
</body>
</html>
