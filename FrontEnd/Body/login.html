<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Feito em Minutos</title>
  <link rel="stylesheet" href="Style/styles.css">
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="logo-icon mx-auto mb-4">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
    </div>
    
    <h2 class="login-title">Bem-vindo de volta!</h2>
    <p class="login-subtitle">Faça login para acessar o Feito em Minutos.</p>
    
    <form class="form" onsubmit="fazerLogin(event)">
      <input type="text" id="username" placeholder="Usuário" required>
      <input type="password" id="password" placeholder="Senha" required>
      
      <p id="msg-erro" class="error-msg" style="display: none;">Usuário ou senha incorretos!</p>
      
      <button type="submit" class="btn-primary mt-4">Entrar na plataforma</button>
    </form>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
