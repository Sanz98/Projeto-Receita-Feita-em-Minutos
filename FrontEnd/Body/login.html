<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Feito em Minutos</title>
  <link rel="stylesheet" href="Style/styles.css">
</head>
<body>

<header class="top-header">
  <div class="logo-container">
    <div class="logo-icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
    </div>
    <h1>Feito em Minutos</h1>
  </div>
</header>

<main class="container">
  <section class="pagina" style="display: block;">
    <div class="hero-card">
      <div class="hero-image">
        <!-- Imagem luxuosa de comida para o login -->
        <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxmb29kJTIwZGFyayUyMGJhY2tncm91bmR8ZW58MXx8fHwxNzc3OTI0MTQ3fDA&ixlib=rb-4.1.0&q=80&w=1080" alt="Login">
        <div class="hero-gradient"></div>
      </div>
      
      <div class="hero-content text-center">
        <h2>Bem-vindo de volta!</h2>
        <p class="subtitle">Faça login para acessar suas receitas, listas de compras e gerenciar seus pedidos.</p>
        
        <!-- Formulário de Login -->
        <form class="form" onsubmit="fazerLogin(event)">
          <input type="text" id="username" placeholder="Nome de usuário" required>
          <input type="password" id="password" placeholder="Sua senha secreta" required>
          
          <!-- Mensagem de erro que fica escondida até errar a senha -->
          <p id="msg-erro" style="color: #ef4444; font-size: 0.875rem; display: none; font-weight: 500;">Usuário ou senha incorretos!</p>
          
          <button type="submit" class="btn-primary shadow-lg mt-24">Entrar na plataforma</button>
        </form>
      </div>
    </div>
  </section>
</main>

<script src="login.js"></script>
</body>
</html>
