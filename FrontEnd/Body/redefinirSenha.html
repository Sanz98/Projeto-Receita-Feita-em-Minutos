<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Nova Senha - Feito em Minutos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #121214; --card-dark: #202024; --primary-food: #FF6B00; --primary-hover: #E55C00; --text-light: #F8F8F2; --text-muted: #A1A1AA; --border-color: #323238; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); display: flex; align-items: center; justify-content: center; min-height: 100vh; background-image: radial-gradient(circle at 50% -20%, #3a1a05, var(--bg-dark) 50%); }
        .auth-container { background: var(--card-dark); padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); width: 100%; max-width: 420px; border: 1px solid var(--border-color); text-align: center; }
        h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
        .subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 30px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; color: var(--text-muted); }
        .input-group input { width: 100%; padding: 14px; border-radius: 12px; background: #121214; border: 1px solid var(--border-color); color: var(--text-light); font-size: 1rem; transition: border 0.3s, box-shadow 0.3s; }
        .input-group input:focus { border-color: var(--primary-food); outline: none; box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.2); }
        .btn-primary { width: 100%; padding: 14px; background: var(--primary-food); color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.3s, transform 0.1s; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Criar Nova Senha 🔒</h2>
        <p class="subtitle">Quase lá! Insere a tua nova palavra-passe de acesso abaixo.</p>

        <form id="form-redefinir">
            <div class="input-group">
                <label for="nova-senha">Nova Senha</label>
                <input type="password" id="nova-senha" placeholder="Mínimo de 6 caracteres" required minlength="6">
            </div>
            
            <button type="submit" class="btn-primary">Salvar Nova Senha</button>
        </form>
    </div>

    <script src="redefinirSenha.js"></script>
</body>
</html>
