<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Entregador - Express</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Style/styles.css">
</head>
<body style="background: #171717; color: #f5f5f5; font-family: 'Poppins', sans-serif; margin: 0; padding-bottom: 80px;">

  <div style="background: #1c1c1e; padding: 20px; border-bottom: 1px solid #323238; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;">
    <div>
      <h2 style="margin: 0; font-size: 1.2rem; font-weight: 700; color: #10b981;">Painel do Estafeta</h2>
      <span style="font-size: 0.85rem; color: #a3a3a3;">Modo: Salário Fixo Ativo</span>
    </div>
    <button onclick="sair()" style="background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer;">Sair</button>
  </div>

  <div class="container" style="max-width: 600px; margin: 20px auto; padding: 0 16px;">
    
    <div id="secao-chamadas">
      <h3 style="font-size: 1.1rem; font-weight: 600; color: #f5f5f5; margin-bottom: 16px;">Pedidos Disponíveis na Região</h3>
      <div id="lista-chamadas-disponiveis">
        </div>
    </div>

    <div id="secao-rastreio" style="display: none;">
      <div class="historico-card" style="padding: 20px; border-left: 4px solid #10b981;">
        <h3 style="margin-top: 0; color: #10b981;">Pedido Aceite • Em Andamento</h3>
        <p id="detalhes-entrega" style="color: #e5e5e5; font-size: 0.95rem;"></p>
        
        <div style="margin: 15px 0; width: 100%; height: 220px; border-radius: 12px; overflow: hidden; border: 1px solid #323238;">
          <iframe src="http://maps.google.com/maps?q=Campinas&t=&z=14&ie=UTF8&iwloc=&output=embed" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>

        <button onclick="confirmarEntrega()" class="btn-primary" style="width: 100%; padding: 14px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Confirmar Entrega ao Cliente</button>
      </div>
    </div>

  </div>

  <div id="toast-container" style="position: fixed; bottom: 30px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 12px; pointer-events: none; align-items: flex-end;"></div>

  <script>
    if (localStorage.getItem('logado') !== 'true' || localStorage.getItem('perfil') !== 'entregador') {
      window.location.href = 'login.html';
    }

    function sair() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    // Banco de dados simulado de chamados para rota rotativa (Se rejeitar, passa para o próximo)
    let chamadosDisponiveis = [
      { id: 1084, cliente: "Diogo Sanz", itens: "Ingredientes para Massa Carbonara", endereco: "Av. Rebouças, Centro, Sumaré" },
      { id: 3291, cliente: "Lucas Neres", itens: "Ingredientes para Bolo de Cenoura", endereco: "Rua Amizade, Nova Veneza, Sumaré" }
    ];

    let pedidoAtual = null;

    function renderizarChamados() {
      const container = document.getElementById("lista-chamadas-disponiveis");
      if (chamadosDisponiveis.length === 0) {
        container.innerHTML = `<p style="color: #737373; text-align: center; margin-top: 4px;">Nenhum chamado ativo no momento. Aguardando novos pedidos...</p>`;
        return;
      }

      container.innerHTML = chamadosDisponiveis.map(c => `
        <div class="historico-card" id="card-${c.id}" style="padding: 16px; margin-bottom: 16px; background: #202024; border: 1px solid #323238; border-radius: 12px;">
          <h4 style="margin: 0 0 8px 0; color: #f5f5f5;">Chamado Shopper #${c.id}</h4>
          <p style="margin: 0 0 4px 0; font-size: 0.9rem; color: #a3a3a3;"><strong>Cliente:</strong> ${c.cliente}</p>
          <p style="margin: 0 0 4px 0; font-size: 0.9rem; color: #a3a3a3;"><strong>Carga:</strong> ${c.itens}</p>
          <p style="margin: 0 0 16px 0; font-size: 0.9rem; color: #a3a3a3;"><strong>Destino:</strong> ${c.endereco}</p>
          
          <div style="display: flex; gap: 10px;">
            <button onclick="aceitarChamado(${c.id})" style="flex: 1; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Aceitar Chamado</button>
            <button onclick="recusarChamado(${c.id})" style="flex: 1; padding: 12px; background: #323238; color: #ef4444; border: 1px solid #ef4444; border-radius: 8px; font-weight: 600; cursor: pointer;">Recusar</button>
          </div>
        </div>
      `).join('');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? '#10b981' : '#ef4444';
      
      toast.style.cssText = `background: #202024; border-left: 4px solid ${bgColor}; color: #f5f5f5; padding: 16px 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-size: 0.95rem; font-weight: 500; width: max-content; pointer-events: auto;`;
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function aceitarChamado(id) {
      pedidoAtual = chamadosDisponiveis.find(c => c.id === id);
      document.getElementById("secao-chamadas").style.display = "none";
      document.getElementById("secao-rastreio").style.display = "block";
      document.getElementById("detalhes-entrega").innerHTML = `
        <strong>Cliente:</strong> ${pedidoAtual.cliente}<br>
        <strong>Itens do Pedido:</strong> ${pedidoAtual.itens}<br>
        <strong>Endereço de Entrega:</strong> ${pedidoAtual.endereco}
      `;
      showToast("Corrida aceita! Siga a rota indicada no mapa.", "success");
      
      // Avisa o localStorage que o motorista X aceitou a corrida (para sincronizar o rastreio do cliente)
      localStorage.setItem('motorista_status', 'em_rota');
      localStorage.setItem('pedido_ativo_id', id);
    }

    function recusarChamado(id) {
      // Remove o chamado da lista do motorista atual e "simula" que foi para outro funcionário
      chamadosDisponiveis = chamadosDisponiveis.filter(c => c.id !== id);
      renderizarChamados();
      showToast("Chamado recusado. Repassando para o próximo entregador disponível.", "error");
    }

    function confirmarEntrega() {
      showToast("Entrega finalizada com sucesso! Bom trabalho.", "success");
      localStorage.setItem('motorista_status', 'entregue');
      
      // Reseta a interface para o próximo chamado
      setTimeout(() => {
        document.getElementById("secao-rastreio").style.display = "none";
        document.getElementById("secao-chamadas").style.display = "block";
        chamadosDisponiveis = chamadosDisponiveis.filter(c => c.id !== pedidoAtual.id);
        pedidoAtual = null;
        renderizarChamados();
      }, 1000);
    }

    // Inicialização da lista
    renderizarChamados();
  </script>
</body>
</html>
